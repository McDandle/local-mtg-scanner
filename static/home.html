<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<title>MTG Tracker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="home">

<header class="topbar">
  <a class="brand" href="/" title="Home">
    <span class="logo" aria-hidden="true">✦</span>
    <h1>MTG Tracker</h1>
  </a>
  <div class="top-actions">
    <div class="nav-slot"></div>
  </div>
</header>

<main>
  <!-- portfolio hero -->
  <section class="hero">
    <div class="hero-grid">
      <div class="stat"><span id="sum-value">$0</span><small>collection value</small></div>
      <div class="stat"><span id="sum-count">0</span><small>cards</small></div>
      <div class="stat"><span id="sum-wish">0</span><small>wishlist</small></div>
      <div class="stat stat-mvp"><span id="sum-decks">0</span><small>decks</small></div>
    </div>
  </section>

  <!-- portfolio tracker -->
  <section class="panel">
    <h2 class="section-title"><span class="title-icon">📈</span> Portfolio value</h2>
    <div id="value-chart" class="chart-box"><p class="dim">Loading…</p></div>
    <p id="value-note" class="dim small-note"></p>
  </section>

  <!-- recently added -->
  <section class="panel">
    <h2 class="section-title"><span class="title-icon">🕒</span> Recently added</h2>
    <div id="recent" class="card-list"><p class="dim">Loading…</p></div>
  </section>

  <!-- quick access -->
  <section class="panel">
    <h2 class="section-title"><span class="title-icon">🗺</span> Quick access</h2>
    <div class="quick-grid">
      <a class="quick-tile" href="/library.html">
        <span class="qt-icon">🗂</span><b>Library</b><small>Scan, browse &amp; manage your cards</small>
      </a>
      <a class="quick-tile" href="/insights.html">
        <span class="qt-icon">📈</span><b>Insights</b><small>Value trends &amp; collection analytics</small>
      </a>
      <a id="quick-decks" class="quick-tile hidden" href="/decks.html">
        <span class="qt-icon">🂠</span><b>Decks</b><small>Build decks from the cards you own</small>
      </a>
    </div>
  </section>
</main>

<script src="/card-modal.js"></script>
<script src="/nav.js"></script>
<script src="/home.js"></script>
</body>
</html>
